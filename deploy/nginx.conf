server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite puts a content hash in these file names, so they never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The page itself is checked on every visit, otherwise a new deploy would not show up.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
